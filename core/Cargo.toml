[package]
name = "spectra_core"
version = "0.1.0"
edition = "2021"
publish = false
autobins = false

[lib]
name = "spectra_core"

[dependencies]
# ─── Key derivation: BIP-39 / BIP-32 / SLIP-0010 / sr25519 ──────────
bip39 = { version = "2", features = ["all-languages"] }
unicode-normalization = "0.1"
pbkdf2 = "0.12"
secp256k1 = { version = "0.29", features = ["alloc", "global-context", "hashes", "recovery", "rand"] }
ed25519-dalek = { version = "2", default-features = false, features = ["alloc", "digest", "fast", "pkcs8", "rand_core", "zeroize"] }
curve25519-dalek = { version = "4", default-features = false, features = ["alloc", "precomputed-tables", "zeroize"] }
schnorrkel = { version = "0.11", default-features = false, features = ["std"] }
hmac = "0.12"
sha2 = "0.10"

# ─── Hashing + address encoding ─────────────────────────────────────
# blake2b_simd is here alongside blake2 because it is the only one of the
# two that exposes BLAKE2b's personalisation field, which Zcash V5
# (ZIP-244) sighashes require. `blake2` covers keyed hashing but not the
# personal-string parameter. Neither is redundant.
bs58 = { version = "0.5", features = ["check"] }
bech32 = "0.11"
ripemd = "0.1"
sha3 = "0.10"
blake2 = "0.10"
blake2b_simd = "1.0"
data-encoding = "2"
crc = "3"
alloy-rlp = { version = "0.3", features = ["derive"] }

# ─── Transaction building + signing ─────────────────────────────────
# The `bitcoin` crate is used by send/chains/bitcoin.rs and nowhere else:
# consensus serialization and sighashes only. Derivation deliberately does
# not go through it — derivation/chains/bitcoin.rs hand-rolls BIP-32,
# base58check and the address encoders. Do not "simplify" one into the other.
#
# secp256k1zkp is the Grin fork of libsecp256k1-zkp, needed for the Pedersen
# commitments and Bulletproof range proofs in Litecoin MWEB peg-ins; upstream
# secp256k1 has neither. Its lib name is `secp256k1zkp`, hence the rename.
bitcoin = { version = "0.32", features = ["rand-std"] }
blake3 = "1"
secp256k1zkp = { package = "grin_secp256k1zkp", version = "0.7" }

# ─── Secrets at rest ────────────────────────────────────────────────
# Master key lives in the platform keychain; Rust owns encrypt/decrypt.
aes-gcm = "0.10"
zeroize = { version = "1", features = ["alloc", "derive"] }

# ─── FFI + serialization ────────────────────────────────────────────
uniffi = { version = "0.31", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
base64 = "0.22"

# ─── Networking + Tor ───────────────────────────────────────────────
# rustls-tls-webpki-roots, never native-roots: on iOS the native trust store
# reads back empty and every HTTPS call fails UnknownIssuer.
# arti-client is a pure-Rust Tor client; tor.rs relays a local SOCKS5 proxy
# through the DataStream connections it hands out.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json", "gzip", "socks"] }
arti-client = { version = "0.22", default-features = false, features = ["rustls", "tokio"] }
tor-rtcompat = { version = "0.22", default-features = false, features = ["tokio", "rustls"] }

# ─── Runtime, persistence, logging ──────────────────────────────────
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"
parking_lot = "0.12"
rusqlite = { version = "0.31", features = ["bundled"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
wiremock = "0.6"
