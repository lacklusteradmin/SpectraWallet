# Concrete network identities and operational rules. Mainnets and testnets are peers.
# EVM membership is defined by registry::Chain, not configured here.
# Presentation belongs to chain-ui.toml, joined by network_id.
# Native token metadata belongs to tokens.toml (testnet-tokens.toml for testnets);
# core derives the native deployment ID as "<network_id>:native".

[[networks]]
id = "bitcoin"
name = "Bitcoin"
family = "bitcoin"
environment = "mainnet"
token_standard = ""
derivation_path = [
  { tag = "nativeSegWit", path = "m/84'/0'/{account}'/0/0", is_default = true },
  { tag = "legacy", path = "m/44'/0'/{account}'/0/0" },
  { tag = "nestedSegWit", path = "m/49'/0'/{account}'/0/0" },
  { tag = "taproot", path = "m/86'/0'/{account}'/0/0" },
  { tag = "electrumLegacy", path = "m/0'/0" },
  { tag = "electrumLegacy", path = "m/0'/0/0" },
]

