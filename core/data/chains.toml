# Spectra built-in chain registry — the source of truth for both front ends.
#
# Two tables, because a chain catalog holds two different kinds of fact:
#
#   [[chains]]   what a chain *is*        — one row per chain
#   [[networks]] which network of it      — one row per testnet
#
# It was one table of seventy-eight rows, so every testnet restated eight of
# its mainnet's columns verbatim, left six more empty, and carried a
# `native_coingecko_id` that must never be used — a testnet asset has no price,
# and something else had to override it.
#
# A network inherits everything from its chain except:
#   * `token_standard` — a testnet hosts no tokens
#   * `native_coingecko_id` — a testnet asset has no price
#   * whatever it states below
#
# Three columns are gone. `primary_use` held the same string as `comment` on
# all seventy-eight rows and was never rendered. `contract_address_prompt` is a
# function of `token_standard`. `is_evm` is a function of `category`, once
# `category` stops doubling as a network-kind flag.

[[chains]]
id = "bitcoin"
name = "Bitcoin"
symbol = "BTC"
gas_token_symbol = "BTC"
search_keywords = ["Bitcoin", "BTC"]
category = "bitcoin-family"
color = "orange"
asset_name = "bitcoin"
address_prefix_hint = "bc1q…"
token_standard = ""
native_coingecko_id = "bitcoin"
native_decimals = 8
native_asset_name = "Bitcoin"
derivation_path = [
    { tag = "nativeSegWit", path = "m/84'/0'/{account}'/0/0", is_default = true },
    { tag = "legacy", path = "m/44'/0'/{account}'/0/0" },
    { tag = "nestedSegWit", path = "m/49'/0'/{account}'/0/0" },
    { tag = "taproot", path = "m/86'/0'/{account}'/0/0" },
    { tag = "electrumLegacy", path = "m/0'/0" },
    { tag = "electrumLegacy", path = "m/0'/0/0" },
]

