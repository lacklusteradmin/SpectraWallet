# Concrete networks. Mainnets and testnets are peers; no record inherits another.
# Native token metadata belongs to tokens.toml; native_deployment references a deployment.

[[networks]]
id = "bitcoin"
name = "Bitcoin"
search_keywords = ["Bitcoin", "BTC"]
category = "bitcoin-family"
color = "orange"
artwork_name = "bitcoin"
address_prefix_hint = "bc1q…"
token_standard = ""
derivation_path = [{ tag = "nativeSegWit", path = "m/84'/0'/{account}'/0/0", is_default = true }, { tag = "legacy", path = "m/44'/0'/{account}'/0/0" }, { tag = "nestedSegWit", path = "m/49'/0'/{account}'/0/0" }, { tag = "taproot", path = "m/86'/0'/{account}'/0/0" }, { tag = "electrumLegacy", path = "m/0'/0" }, { tag = "electrumLegacy", path = "m/0'/0/0" }]
family = "bitcoin"
environment = "mainnet"
native_deployment = "bitcoin:native"

