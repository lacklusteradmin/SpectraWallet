# Spectra built-in token registry — the source of truth for both front ends.
#
# Two tables, because a token catalog holds two different kinds of fact:
#
#   [[tokens]]      what a token *is*   — one row per token
#   [[deployments]] where it lives      — one row per (token, chain)
#
# It was one table of ninety-one rows, so every field of a token that ships on
# ten chains was written ten times. Two had already drifted apart.

# ── Tokens: what a token *is*. One row per token, however many chains
#    it is deployed on.
#
#    These were repeated on every deployment row — 91 rows carrying 31
#    tokens' worth of names, colours and coingecko ids — and two of them
#    had already drifted: DAI read "Dai" in orange on Ethereum and "Dai
#    Stablecoin" in yellow on Base and Polygon, for the same token.

# ── Market-data ids: three providers, three id spaces, one column each.
#
#    `coinpaprika_id` is CoinPaprika's own slug and is not derivable from the
#    symbol — Aave is `aave-new`, Cronos is `cro-cryptocom-chain`, BitTorrent
#    is `bttc-bittorrent-chain`, Tether America USD is bare `usat`. It was a
#    hand-written table in `price.rs` covering a third of this file, three of
#    whose ids no longer resolved, and what it missed fell through to matching
#    on symbol: paprika lists thousands of coins, so BUSD priced as Binance USD
#    and TON as TONToken. Nothing matches on symbol now.
#
#    Empty means no identity we could verify — a fallback quote lost, never a
#    wrong one. `BUSD` is empty because ours is Bera USD and paprika's BUSD is
#    Binance USD.
#
#    `coinlore_nameid` is stated only where it differs from `coingecko_id`;
#    both are name slugs and they agree for every asset but seven.

[[tokens]]
symbol = "AAVE"
name = "Aave"
coingecko_id = "aave"
coinpaprika_id = "aave-new"
color = "indigo"
asset_name = "aave"
tags = []

