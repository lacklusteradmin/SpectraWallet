# Transaction explorers: the web page a transaction's detail screen links to,
# at most one per network. `chain_id` references a concrete chains.id in
# chains.toml; `{hash}` in `tx_url` is replaced by the transaction hash.
#
# Spectra never requests these pages. Anything it does request is an API and
# belongs in endpoints.toml.

[[explorers]]
chain_id = "bitcoin"
name = "Mempool"
tx_url = "https://mempool.space/tx/{hash}"

