# Spectra endpoint directory — every service the app talks to, per network.
# `chain_id` references a concrete chains.id in chains.toml. Mainnets and
# testnets are peers; display names and settings groups are derived from registry.
#
# `api` specifies the request/response contract. Transaction explorer pages are
# not services the app talks to; they live in explorers.toml.
#
#   capabilities  what it is used *for*, and a claim that has to be true
#     balance history token-history token-discovery token-balance
#     utxo fee broadcast verification staking
#
# `balance` is native-coin balance; token balances have their own capability.
# `history` is address history for the native coin; `token-history` is
# fungible-token transfers, not approvals or arbitrary contract activity.
# `token-discovery` enumerates holdings without a caller-supplied token list;
# `token-balance` answers about a specified token, including its metadata.
#
# Address history is the part that needs care. An EVM node cannot serve it — there is
# no `eth_getTransactionsByAddress`, because a node indexes transactions by
# block, and answering per-address means scanning every block ever produced.
# Solana's `getSignaturesForAddress` and XRP's `account_tx` are real node
# methods, so those nodes do carry address history. Whether a node can index by address is a
# protocol fact, not a provider one. `no_evm_node_claims_history` asserts it.
#
# Order matters: `with_fallback` tries a chain's endpoints top to bottom, so a
# dead one costs a timeout plus 180 ms on every call that reaches it. Run
# `spectra endpoints` to find them.

[[endpoints]]
id = "bitcoin.blockchain_info.multiaddr"
api = "blockchain-info"
chain_id = "bitcoin"
endpoint = "https://blockchain.info/multiaddr"
capabilities = ["balance", "history"]

