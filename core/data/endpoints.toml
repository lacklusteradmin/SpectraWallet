# Spectra endpoint directory — every service the app talks to, per chain.
#
# Two vocabularies, deliberately separate. They used to share one `roles` array
# and nothing kept them consistent: ten EVM chains' JSON-RPC nodes lost their
# marker and were probed with a GET, and forty-six records claimed a `history`
# capability no EVM node can serve.
#
#   kind          what the endpoint *is*, which decides how to talk to it
#     rpc-node    JSON-RPC. POST a method to it.
#     indexer     an address-indexed API. Its rows are keyed by address.
#     web-link    a /tx/ URL for a person to open. Not an API; claims nothing.
#     backend     a Monero light-wallet server.
#
#   capabilities  what it is used *for*, and a claim that has to be true
#     read balance history utxo fee broadcast verification
#
# `history` is the one that needs care. An EVM node cannot serve it — there is
# no `eth_getTransactionsByAddress`, because a node indexes transactions by
# block, and answering per-address means scanning every block ever produced.
# Solana's `getSignaturesForAddress` and XRP's `account_tx` are real node
# methods, so those nodes do carry it. Whether a node can index by address is a
# protocol fact, not a provider one. `no_evm_node_claims_history` asserts it.
#
# Order matters: `with_fallback` tries a chain's endpoints top to bottom, so a
# dead one costs a timeout plus 180 ms on every call that reaches it. Run
# `spectra endpoints` to find them.

[[endpoints]]
id = "bitcoin.blockchain_info.multiaddr"
chain_name = "Bitcoin"
provider_id = "blockchain-info"
endpoint = "https://blockchain.info/multiaddr"
kind = "indexer"
capabilities = ["read", "balance", "history"]

