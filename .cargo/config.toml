# iOS minimum version for the Rust core. Keep it equal to
# IPHONEOS_DEPLOYMENT_TARGET in swift/Spectra.xcodeproj: C objects from build
# scripts (ring, secp256k1, …) are stamped with it, and rustc's own default is
# too old for the current SDK to link against.

[env]
IPHONEOS_DEPLOYMENT_TARGET = "26.0"

[target.aarch64-apple-ios]
rustflags = ["-C", "link-arg=-miphoneos-version-min=26.0"]

[target.aarch64-apple-ios-sim]
rustflags = ["-C", "link-arg=-mios-simulator-version-min=26.0"]
