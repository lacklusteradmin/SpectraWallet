[package]
name = "spectra-cli"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "spectra"
path = "src/main.rs"

[dependencies]
spectra_core = { path = "../core" }
# base64: SecretStore values are opaque strings; the seed envelope, salt and
# password verifier are bytes, so they ride across as base64.
base64 = "0.22"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
rpassword = "7"
uuid = { version = "1", features = ["v4"] }
# pbkdf2 + sha2: master-key derivation for the seed envelope.
pbkdf2 = "0.12"
sha2 = "0.10"
dirs = "5"
getrandom = "0.2"
bip39 = { version = "2", features = ["all-languages"] }
colored = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
